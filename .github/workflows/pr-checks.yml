name: pr-checks.yml
on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up the environment
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # Step 3: Run linter (ktfmt)
      - name: Run ktfmt
        run: ./gradlew ktfmtCheck

      # Step 4: Run tests
      - name: Run Tests
        run: ./gradlew test
        env:
          DISCORD_CLIENT_ID: 'some-id'
          DISCORD_CLIENT_SECRET: 'some-secret'
          JWT_SECRET: 'some_really_really_long_secret_key'
          DATABASE_URL: 'jdbc:postgresql://localhost:5432/harmony'
          DATABASE_USER: 'some-user'
          DATABASE_PASS: 'some-pass'
