name: pr-checks.yml
on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  pr-checks:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up the environment
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # Step 3: Run linter (ktfmt)
      - name: Run ktfmt
        run: ./gradlew ktfmtCheck

      # Step 4: Run tests
      - name: Run Tests
        run: ./gradlew test --continue -Dspring.profiles.active=test

      #Step 5: Upload test reports
      - name: Upload Gradle Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-reports
          path: build/reports/
          retention-days: 3
