spring.application.name=harmony-backend

# Environment
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# Scheduled import
feature.scheduled.import.enabled=${IMPORT_ENABLED:false}

# disabling generic white label error
server.error.whitelabel.enabled=false

server.port=${PORT:8080}

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Frontend
frontEndBaseUrl=${FRONT_END_BASE_URL}

# Security
spring.security.oauth2.client.registration.discord.client-id=${DISCORD_CLIENT_ID}
spring.security.oauth2.client.registration.discord.client-secret=${DISCORD_CLIENT_SECRET}
spring.security.oauth2.client.registration.discord.scope=identify,email
spring.security.oauth2.client.registration.discord.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.discord.redirect-uri={baseUrl}/login/oauth2/code/discord
spring.security.oauth2.client.provider.discord.authorization-uri=https://discord.com/api/oauth2/authorize
spring.security.oauth2.client.provider.discord.token-uri=https://discord.com/api/oauth2/token
spring.security.oauth2.client.provider.discord.user-info-uri=https://discord.com/api/users/@me
spring.security.oauth2.client.provider.discord.user-name-attribute=id
jwt.secret=${JWT_SECRET}

# Database config
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${JDBC_DATABASE_USERNAME}
spring.datasource.password=${JDBC_DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=${validate}
spring.datasource.driver-class-name=org.postgresql.Driver
#spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Set spring.jpa.open-in-view to false to turn off lazy loading if DB performance becomes and issue later
spring.jpa.open-in-view=true


# controls the hot reload provided by spring dev tools
spring.devtools.restart.enabled=${HOT_RELOAD:false}
spring.devtools.livereload.enabled=${HOT_RELOAD:false}

# Sentry
sentry.enabled=${SENTRY_ENABLED:false}
sentry.environment=${SENTRY_ENV:dev}
sentry.dsn=${SENTRY_DSN:}
# Sets Sentry to capture 10% of transactions for tracing.
sentry.traces-sample-rate=${SENTRY_SAMPLE_RATE:0.1}
# Determines whether to capture data like request headers, body and IP for users
sentry.send-default-pii=${SENTRY_PII_ENABLED:false}
sentry.max-request-body-size=none

# Logging
# Log pattern: timestamp, log level, classname - message
logging.pattern.console=%d{HH:mm:ss:SSS} %-5level %logger{1}: user=%X{userId} - %msg%n
spring.output.ansi.enabled=ALWAYS
logging.level.web=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.apache.catalina=WARN
logging.level.org.apache.coyote=WARN
logging.level.org.apache.tomcat=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.flywaydb.core=WARN
logging.level.iterative.harmony.backend=${HARMONY_LOG_LEVEL:INFO}

#logging.level.org.springframework.security=TRACE